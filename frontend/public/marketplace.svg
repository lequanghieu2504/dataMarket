<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Elements -->
  <circle cx="400" cy="300" r="250" fill="url(#gradient1)" opacity="0.1"/>
  <circle cx="400" cy="300" r="200" fill="url(#gradient2)" opacity="0.15"/>
  
  <!-- Shopping Cart Icon -->
  <path d="M300 250h200l-25 100H325L300 250z" stroke="currentColor" stroke-width="8" stroke-linejoin="round"/>
  <circle cx="350" cy="400" r="20" fill="currentColor"/>
  <circle cx="450" cy="400" r="20" fill="currentColor"/>
  
  <!-- Data Elements -->
  <rect x="250" y="150" width="40" height="80" rx="4" fill="url(#gradient3)"/>
  <rect x="310" y="180" width="40" height="50" rx="4" fill="url(#gradient3)"/>
  <rect x="370" y="160" width="40" height="70" rx="4" fill="url(#gradient3)"/>
  <rect x="430" y="140" width="40" height="90" rx="4" fill="url(#gradient3)"/>
  <rect x="490" y="170" width="40" height="60" rx="4" fill="url(#gradient3)"/>
  
  <!-- Decorative Elements -->
  <circle cx="250" cy="450" r="10" fill="url(#gradient2)"/>
  <circle cx="550" cy="450" r="10" fill="url(#gradient2)"/>
  <circle cx="400" cy="150" r="10" fill="url(#gradient2)"/>
  
  <!-- Gradients -->
  <defs>
    <linearGradient id="gradient1" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" style="stop-color: hsl(var(--p))"/>
      <stop offset="100%" style="stop-color: hsl(var(--s))"/>
    </linearGradient>
    
    <linearGradient id="gradient2" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" style="stop-color: hsl(var(--s))"/>
      <stop offset="100%" style="stop-color: hsl(var(--a))"/>
    </linearGradient>
    
    <linearGradient id="gradient3" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0%" style="stop-color: hsl(var(--p))"/>
      <stop offset="100%" style="stop-color: hsl(var(--s))"/>
    </linearGradient>
  </defs>
</svg>